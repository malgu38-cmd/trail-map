<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.vworld.kr https://map.ngii.go.kr https://*.tile.opentopomap.org https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self' https://api.github.com https://*.vworld.kr https://map.ngii.go.kr https://www.cloudflare.com; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="산행지도">
<meta name="theme-color" content="#E83828">
<title>산행지도</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --red:#E83828; --red2:#F04E37; --peach:#FFEADF; --gray:#787878; --line:#BFBFBF;
  --ink:#1f1f1f; --bg:#ffffff; --btn:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  font-size:21px;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#e8e8e8}

/* 오른쪽 버튼 줄 */
#tools{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
  display:flex;flex-direction:column;gap:12px;z-index:1000}
.tbtn{width:var(--btn);height:var(--btn);border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:0;cursor:pointer}
.tbtn svg{width:30px;height:30px}
.tbtn.on{background:var(--red);border-color:var(--red);color:#fff}

/* 상단 안내 띠 (모드 안내) */
#banner{position:fixed;left:calc(12px + env(safe-area-inset-left));right:calc(84px + env(safe-area-inset-right));
  top:calc(12px + env(safe-area-inset-top));z-index:1000;background:var(--red);color:#fff;border-radius:14px;
  padding:12px 16px;font-size:21px;font-weight:700;display:none;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#banner .grow{flex:1;line-height:1.3}
#banner button{font-size:20px;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:#fff;color:var(--red)}

/* 하단 정보 띠 */
#info{position:fixed;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));
  bottom:calc(12px + env(safe-area-inset-bottom));z-index:1000;background:rgba(255,255,255,.96);border:2px solid var(--line);
  border-radius:16px;padding:10px 16px;font-size:21px;line-height:1.35;display:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#info b{color:var(--red)}

/* 바텀시트 */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2000;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:2001;background:#fff;border-radius:22px 22px 0 0;
  padding:18px 20px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;display:none;
  box-shadow:0 -4px 20px rgba(0,0,0,.25)}
#sheet h2{font-size:28px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
#sheet h2 .x{margin-left:auto;border:0;background:none;padding:6px;color:var(--gray)}
#sheet h3{font-size:23px;margin:22px 0 10px;color:var(--red)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:22px;padding:16px;margin:0 0 10px;
  border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.opt.sel{border-color:var(--red);background:var(--peach);font-weight:700}
.opt small{display:block;font-size:18px;color:var(--gray);font-weight:400;margin-top:2px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.types button{font-size:20px;padding:14px 6px;border:2px solid var(--line);border-radius:14px;background:#fff;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.types svg{width:36px;height:36px}
#sheet h2 svg{width:30px;height:30px}
.types button.sel{border-color:var(--red);background:var(--peach);font-weight:700}
input[type=text],input[type=password]{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:12px;margin-bottom:14px}
.big{width:100%;font-size:23px;font-weight:700;padding:16px;border:0;border-radius:14px;background:var(--red);color:#fff;margin-top:4px}
.sub{width:100%;font-size:21px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin-top:10px}
.row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.row .name{font-size:21px;line-height:1.3}
.row .btns{display:flex;gap:8px}
.row .btns button{flex:1}
.row.hid .name{color:var(--gray)}
.row .name small{display:block;color:var(--gray);font-size:18px}
.row button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:19px;color:var(--ink)}
.row button.del{color:var(--red);border-color:#f3b7b0}
.sbox{display:flex;gap:10px;margin-bottom:6px}
.sbox input{flex:1;margin:0}
.sbox button{font-size:21px;font-weight:700;border:0;border-radius:12px;padding:0 18px;background:var(--red);color:#fff;white-space:nowrap}
.res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:#fff;padding:14px 4px;font-size:21px;line-height:1.35;color:var(--ink)}
.res small{display:block;color:var(--gray);font-size:18px}
.res .tag{display:inline-block;font-size:15px;font-weight:700;color:var(--red);background:var(--peach);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.hit{width:26px;height:26px;border-radius:50%;background:#1f1f1f;border:4px solid #fff;box-shadow:0 0 0 3px #E83828,0 2px 6px rgba(0,0,0,.35)}
.empty{color:var(--gray);font-size:20px;padding:6px 0}
.note{font-size:18px;color:var(--gray);line-height:1.45;margin-top:14px}
.stat{font-size:21px;line-height:1.45;margin:0 0 6px;padding:14px 16px;border-radius:14px;background:var(--peach)}
.stat.bad{background:#fff;border:2px solid var(--red);color:var(--red);font-weight:700}
.stat small{display:block;font-size:18px;color:var(--gray);font-weight:400;margin-top:4px}
#bList{position:relative}
#bList.warn::after{content:'';position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid #fff}

/* 마커 */
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin svg{transform:rotate(45deg);width:18px;height:18px}
.me{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:4px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4),0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content{font-size:21px;line-height:1.4;margin:14px 16px}
.leaflet-popup-content button{font-size:19px;margin-top:10px;padding:8px 12px;border-radius:10px;border:2px solid #f3b7b0;background:#fff;color:var(--red)}
.leaflet-control-attribution{font-size:11px}
.leaflet-control-scale-line{font-size:15px}
.mlabel{background:transparent;padding:0;border:0;box-shadow:none;white-space:nowrap}
.mlabel span{display:block;font-size:17px;font-weight:700;padding:3px 8px;border-radius:8px}
.nolabel .mlabel{display:none}
.types .ti{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;margin:0 auto 6px}
.types .ti svg{width:30px;height:30px}
.mlabel:before{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="banner"><span class="grow" id="bannerText"></span><button id="bannerBtn">끝내기</button></div>

<div id="tools">
  <button class="tbtn" id="bSearch" title="장소 검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
  <button class="tbtn" id="bLocate" title="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="tbtn" id="bLayers" title="지도 종류"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg></button>
  <button class="tbtn" id="bPin" title="표시 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></button>
  <button class="tbtn" id="bRuler" title="거리 재기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg></button>
  <button class="tbtn" id="bGpx" title="GPX 불러오기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></button>
  <button class="tbtn" id="bList" title="목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg></button>
</div>

<div id="info"></div>
<div id="sheetBg"></div>
<div id="sheet"></div>
<input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,application/xml,text/xml" style="display:none">
<input type="file" id="backupFile" accept=".json,application/json" style="display:none">

<script src="lib/leaflet.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
